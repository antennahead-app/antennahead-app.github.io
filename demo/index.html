<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <!-- Basic Page Needs
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->

  <meta charset="utf-8">
  <title>AntennaHead — Web UI Preview</title>
  <meta name="description" content="Interactive preview of the AntennaHead software-defined-radio web UI.">
  <meta name="author" content="">

  <!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="stylesheet" href="dist/css/normalize.css">
  <link rel="stylesheet" href="dist/css/skeleton.css">
  <link rel="stylesheet" href="css/custom.css?v=preview">

  <!-- Scripts
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script src="js/jquery.min.js"></script>

  <script src="js/site.js?v=preview"></script>

  <script src="js/antennahead.js?v=preview"></script>

  <!-- Mock backend for the static GitHub Pages preview. MUST load after
       antennahead.js so it can neutralise the live-server polling loops and
       stub the audio pipeline. Not part of the real app. -->
  <script src="js/mock.js?v=preview"></script>

  <!-- Favicon
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">

  <style>
    html {
        height:100%;
        width:100%;
    }
    body {
        position: relative;
        top: 0;
        left: 0;
        height:100%;
        width:100%;
        margin: 0;
        padding: 0;
        overflow:hidden!important;
    }

    div#navigationbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50px;
        border: 1px;
        overflow: hidden;
        background-color: var(--ah-bar-bg, lightgray);
    }

    div#content_frame {
        position: fixed;
        border: none;
        top: 50px;
        left: 0;
        width: 100%;
        height: calc(100% - 100px);
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
        overflow-y: scroll;
        word-wrap: break-word;
    }

    div#audioplayer {
        position: fixed;
        top: calc(100% - 50px);
        left: 0;
        width: 100%;
        height: 50px;
        border: 1px;
        overflow: hidden;
        background-color: var(--ah-bar-bg, lightgray);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
    }

    div#audiodiv {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
    }

    div#audiodiv > audio {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
    }

    /* --- preview-only navigation bar chrome --- */
    #navigationbar .navrow {
        display: flex;
        align-items: center;
        height: 50px;
        padding: 0 10px;
        gap: 10px;
        font-family: "Raleway", "HelveticaNeue", Helvetica, Arial, sans-serif;
    }
    #navigationbar .navbtn {
        appearance: none;
        border: 1px solid rgba(0,0,0,0.2);
        background: rgba(255,255,255,0.6);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        color: inherit;
        white-space: nowrap;
    }
    #navigationbar .navbtn:active { background: rgba(0,0,0,0.08); }
    #navigationbar .navtitle {
        flex: 1 1 auto;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 14px;
    }

    /* preview ribbon injected by mock.js */
    #preview-ribbon {
        position: fixed;
        z-index: 9999;
        left: 0; right: 0;
        top: 50px;
        background: #b23b2e;
        color: #fff;
        font: 600 11px/1.4 "Raleway", Helvetica, Arial, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
        padding: 3px 8px;
    }
    #preview-ribbon + #content_frame,
    #preview-ribbon ~ #content_frame { top: 72px; height: calc(100% - 122px); }
  </style>


  <script>

    var callStack = new Array();    // for the back button and other uses

    var nowPlayingTitle = "";

    var liveStreamAudioSrc = null;
    var audioElementInDownloadMode = false;

    function audioElementLog(audioElement, message)
    {
        console.log('[' + new Date().toISOString() + '] '+message);
    }

    // In the real app these drive a live HLS <audio> element. The preview has
    // no stream, so mock.js replaces the heavy ones; these thin stubs keep the
    // inline on* handlers in the audio bar from throwing.
    function audioPlayerStarted(a){ audioElementLog(a,"audioPlayerStarted"); }
    function audioPlayerPaused(a){ audioElementLog(a,"audioPlayerPaused"); }
    function audioPlayerLoadedData(a){ audioElementLog(a,"audioPlayerLoadedData"); }
    function audioPlayerAbort(a){}
    function audioPlayerCanPlay(a){}
    function audioPlayerCanPlaythrough(a){}
    function audioPlayerEmptied(a){}
    function audioPlayerEnded(a){}
    function audioPlayerError(a,e){}
    function audioPlayerDurationChange(a){}
    function audioPlayerLoadedMetadata(a){}
    function audioPlayerLoadStart(a){}
    function audioPlayerPlay(a){}
    function audioPlayerPlaying(a){}
    function audioPlayerProgress(a){}
    function audioPlayerRateChange(a){}
    function audioPlayerSeeked(a){}
    function audioPlayerSeeking(a){}
    function audioPlayerStalled(a){}
    function audioPlayerSuspend(a){}
    function audioPlayerTimeUpdate(a){}
    function audioPlayerWaiting(a){}

    function startAudioPlayer(){ /* replaced by mock.js */ }
    function startDownloadAudioPlayer(url, loop){ /* replaced by mock.js */ }
    function handleAudioPlayerMessage(event){ /* replaced by mock.js */ }
    function seekToEndForAudioElement(a){}
    function updateAudioElementSrc(){}
    function updateSrcForAudioElement(a){}
    function emptyBufferDataForAudioPlayer(a){}
    function startAudioPlayerAfterDelay(){ /* replaced by mock.js */ }


    function bodyElementLoaded(event)
    {
        console.log("bodyElementLoaded");
        loadContent("index2.html");
        window.addEventListener("message", function(event){ if (typeof handleAudioPlayerMessage === 'function') handleAudioPlayerMessage(event); }, false);
    }


    function loadContent(contentFileName)
    {
        console.log("loadContent: " + contentFileName);

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var contentFrameDiv = window.document.getElementById("content_frame");
                contentFrameDiv.visibility = 'hidden';
                contentFrameDiv.scrollTop = 0;
                contentFrameDiv.innerHTML = xhttp.response;
                contentFrameDiv.visibility = 'visible';

                if (typeof window.__ahPreviewHydrate === 'function') {
                    window.__ahPreviewHydrate(contentFrameDiv);
                }

                if (typeof populateUSBDeviceDatalist === 'function') populateUSBDeviceDatalist();
                if (typeof initTunerDigitKeyboard === 'function') initTunerDigitKeyboard();
                if (typeof initFeedbackSettings === 'function') initFeedbackSettings();

                if (contentFileName == "index2.html") {
                    callStack = new Array();
                } else {
                    callStack.push(contentFileName);
                }
            }
        };
        xhttp.open("GET", contentFileName, true);
        xhttp.send();
    }


    function backButtonClicked(element)
    {
        callStack.pop();
        var previousContentFileName = callStack.pop();
        if (previousContentFileName === undefined) {
            previousContentFileName = "index2.html";
        }
        loadContent(previousContentFileName);
    }


    function topButtonClicked(element)
    {
        loadContent("index2.html");
    }

  </script>

</head>
<body onload="bodyElementLoaded(event);">

    <div id="navigationbar">
      <div class="navrow">
        <button class="navbtn" onclick="backButtonClicked(this);" title="Back">&#8249; Back</button>
        <button class="navbtn" onclick="topButtonClicked(this);" title="Main menu">Menu</button>
        <span class="navtitle">AntennaHead</span>
        <button class="navbtn" onclick="loadContent('nowplaying.html');" title="Now Playing">Now&nbsp;Playing</button>
      </div>
    </div>

    <div id="content_frame">
    </div>

    <div id="audioplayer">
        <div id="audiodiv">
            <button id="record_toggle" class="navbtn" type="button" onclick="if(typeof aacRecorderToggle==='function')aacRecorderToggle();" title="Record">&#9679; REC</button>
            <audio id="audio_element" controls playsinline preload="none"></audio>
        </div>
    </div>

</body>
</html>
